services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: landstack-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-landstack}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-landstack}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
